# Baked into the API container image (see Dockerfile) as
# /app/fabric.config.yaml, used by POST /api/v1/inventory/refresh (the Fabric
# Data Pipeline's scheduled Web activity trigger). Uses managed_identity auth
# because the Container App authenticates via its user-assigned identity
# (AZURE_CLIENT_ID) rather than a stored client secret -- unlike the local
# dev fabric.config.yaml, which uses a service-principal secret for
# non-Azure-hosted local runs.
fabric:
  semantic:
    max_results: 50
    max_traversal_nodes: 500
    max_traversal_depth: 32
    max_source_rows: 50000
    max_serialized_bytes: 1000000
  operations_agent:
    max_output_items: 100
    max_serialized_bytes: 1000000
  patch_intelligence:
    enabled: true
    max_resources: 5000
    max_evidence_rows: 50000
    max_output_items: 100
    max_serialized_bytes: 1000000
  auth:
    mode: managed_identity
    tenant_id: "ffc83107-fcc0-4d2e-8798-d582da36505e"
    # Explicit client ID required: the Container App's identity block can
    # carry more than one identity, so an empty value is ambiguous and
    # ManagedIdentityCredential falls back to an App Service credential path
    # that isn't present in Container Apps, failing with
    # "App Service managed identity configuration not found in environment".
    managed_identity_client_id: "4318b70e-9626-4866-abfd-b10dfc0a9d66"

  workspace_id: "1c328da7-2490-48dc-9ba6-de8c1f333756"
  workspace_name: "aiops-dev-ops"
  # Fresh, disposable validation lakehouse created for API cutover testing.
  lakehouse_id: "6317eaf6-e597-4b4e-a07d-c53027c01feb"
  lakehouse_name: "operational_context_graph_v2"
  # Authoritative Fabric SQL analytics endpoint for the deployed Exposure
  # read model. This is endpoint metadata only; authentication stays on the
  # Container App's user-assigned managed identity.
  sql_endpoint:
    server: "a4y4r76a7qxe3b4y2wbnunsqly-u6gteheqetoerg5g32gb6mzxky.datawarehouse.fabric.microsoft.com"
    database: "b4089445-1001-45a6-a0ea-2b4a0851eace"
    schema: "dbo"
  capacity:
    subscription_id: "a87a8e64-a52a-4aa8-a760-5e8919d23cd1"
    resource_group: "aiops-dev-rg"
    capacity_name: "aiopsdevcapg6ludc"
  create_lakehouse_if_missing: false
  table_schema: ""
  ontology:
    enabled: true
    ontology_id: ""
    ontology_name: "Operational_Context_Ontology_v2"
  exposure:
    enabled: true
    adapter: fabric_sql
    rollback_mode: false

  source_data_root: "/data/inventory-source"
  registration_attempts: 20
  # Most of the ~60 published tables are OVERWRITE-mode and independent of
  # each other, so raising worker count directly cuts wall-clock publish
  # time; 4 workers left the sync serialized into 15+ batches against
  # publish_timeout_seconds=120 (see arg.config.deploy.yaml).
  write_workers: 12
  patch_policies:
    - name: "Production baseline"
      environment: "Production"
      max_patch_age_days: 30
      minimum_compliance_score: 90
    - name: "Development baseline"
      environment: "Development"
      max_patch_age_days: 60
      minimum_compliance_score: 80
  lifecycle:
    enabled: true
    catalog_path: ""
    approaching_months: 24
    near_months: 12
    critical_months: 6
    max_output_items: 100
    max_serialized_bytes: 1000000
  incident_causality:
    enabled: true
    lookback_hours: 168
    max_incidents: 10000
    max_evidence_rows: 50000
  change_intelligence:
    enabled: true
    max_changes: 50000
    max_output_items: 100
  predictive:
    enabled: true
    max_history_rows: 50000
    max_output_items: 100
  remediation:
    enabled: true
    max_resources: 5000
    max_plans: 1000
    max_output_items: 100
    max_dependencies: 100

  shortcuts: []
