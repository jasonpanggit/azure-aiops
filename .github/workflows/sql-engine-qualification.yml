name: SQL Server engine tests (Linux x64)

on:
  pull_request:
    paths:
      - ".github/workflows/sql-engine-qualification.yml"
      - "pyproject.toml"
      - "src/ontology_discovery/sql_control/**"
      - "src/ontology_discovery/sql_publication_control.py"
      - "tests/test_sql_publication_control.py"
      - "tests/test_sql_publication_control_integration.py"
      - "tests/test_sql_control_engine_adversarial.py"
      - "tests/test_sql_control_engine_ownership_chain.py"
      - "tests/test_sql_reserved_identifiers.py"
      - "tests/test_sql_publication_timeout_engine.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sql-engine-qualification.yml"
      - "pyproject.toml"
      - "src/ontology_discovery/sql_control/**"
      - "src/ontology_discovery/sql_publication_control.py"
      - "tests/test_sql_publication_control.py"
      - "tests/test_sql_publication_control_integration.py"
      - "tests/test_sql_control_engine_adversarial.py"
      - "tests/test_sql_control_engine_ownership_chain.py"
      - "tests/test_sql_reserved_identifiers.py"
      - "tests/test_sql_publication_timeout_engine.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SQL_ENGINE_CONTAINER: sql-engine-${{ github.run_id }}-${{ github.run_attempt }}
      SQL_SERVER_IMAGE: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require native x86-64 host
        run: test "$(uname -m)" = x86_64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install ODBC Driver 18
        run: |
          curl --fail --silent --show-error --location \
            https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,fabric-sql]"

      - name: Start isolated SQL Server
        shell: bash
        run: |
          set -euo pipefail
          password="Qx9!$(openssl rand -hex 28)"
          echo "::add-mask::$password"
          echo "FABRIC_PUBLICATION_SQL_LOCAL_PASSWORD=$password" >> "$GITHUB_ENV"
          env_file="$RUNNER_TEMP/sql-engine-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          umask 077
          printf 'ACCEPT_EULA=Y\nMSSQL_PID=Developer\nMSSQL_MEMORY_LIMIT_MB=4096\nMSSQL_SA_PASSWORD=%s\n' \
            "$password" > "$env_file"
          docker run --detach --rm \
            --name "$SQL_ENGINE_CONTAINER" \
            --platform linux/amd64 \
            --memory 5g --memory-swap 5g --cpus 3 --pids-limit 512 \
            --publish 127.0.0.1::1433 \
            --env-file "$env_file" \
            "$SQL_SERVER_IMAGE" >/dev/null

          port="$(docker port "$SQL_ENGINE_CONTAINER" 1433/tcp | sed 's/.*://')"
          case "$port" in
            ''|*[!0-9]*) echo "SQL Server did not receive a valid loopback port" >&2; exit 1 ;;
          esac
          echo "FABRIC_PUBLICATION_SQL_LOCAL_PORT=$port" >> "$GITHUB_ENV"

          ready=0
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Running}}' "$SQL_ENGINE_CONTAINER")" != true ]; then
              echo "Disposable SQL Server exited before readiness" >&2
              exit 1
            fi
            if docker exec "$SQL_ENGINE_CONTAINER" bash -c \
              'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -C -l 5 -t 10 -Q "SET NOCOUNT ON; SELECT 1" -b' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then
            echo "Disposable SQL Server readiness deadline exceeded" >&2
            exit 1
          fi

          docker exec "$SQL_ENGINE_CONTAINER" bash -c \
            'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -C -l 5 -t 20 -Q "CREATE DATABASE publication_protocol_test" -b'

      - name: Run SQL control engine tests
        env:
          FABRIC_PUBLICATION_SQL_REQUIRED: "1"
        run: |
          python -m pytest -v --tb=short -rA \
            --junitxml=sql-engine-results/results.xml \
            tests/test_sql_publication_control_integration.py \
            tests/test_sql_control_engine_adversarial.py \
            tests/test_sql_control_engine_ownership_chain.py \
            tests/test_sql_reserved_identifiers.py \
            tests/test_sql_publication_timeout_engine.py

      - name: Reject skipped or missing engine cases
        if: always() && hashFiles('sql-engine-results/results.xml') != ''
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("sql-engine-results/results.xml").getroot()
          suites = list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
          print(f"SQL engine cases: tests={tests} skipped={skipped} failures={failures} errors={errors}")
          if tests < 22 or skipped or failures or errors:
              sys.exit("SQL engine test run incomplete or unsuccessful")
          PY

      - name: Upload SQL engine test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-engine-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: sql-engine-results/results.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Remove isolated SQL Server
        if: always()
        run: |
          docker rm --force "$SQL_ENGINE_CONTAINER" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/sql-engine-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
