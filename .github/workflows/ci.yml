name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so the pilot's promotion pipeline
# never deploys a stale, already-outdated commit while a newer push's CI is
# still queued behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase contract tests compare against a pinned historical base.
          # A shallow PR checkout cannot resolve that commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,api]"
      - run: python -m ruff check src tests
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Dependency and secret scanning: catches vulnerable pins and
      # accidentally committed credentials before they reach `main`, per the
      # pilot's "Deployment and CI/CD" hardening requirement. Findings are
      # uploaded as SARIF so they surface in the repo's Security tab rather
      # than only in this job's log.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
