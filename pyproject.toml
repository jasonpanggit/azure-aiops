[project]
name = "aiops-azure-resource-graph"
version = "0.1.0"
description = "AIOps plugin and connector for Azure Resource Graph to Fabric-aligned ontology datasets"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.19,<2",
  "azure-keyvault-secrets>=4.9,<5",
  "azure-storage-file-datalake>=12.18,<13",
  "deltalake>=1.0,<2",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.29,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pyarrow>=23.0.1,<24",
  "PyYAML>=6,<7",
  "fsspec>=2024.6,<2025",
  "adlfs>=2024.7,<2025",
]

[project.optional-dependencies]
api = [
    "agent-framework>=1.0,<2",
    "azure-ai-projects>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]
fabric-sql = ["pyodbc==5.3.0"]
test = ["pytest>=9.0.3,<10", "ruff>=0.16,<0.17", "fastapi>=0.115,<1", "httpx>=0.27,<1"]

[project.scripts]
aiops-inventory = "onboarding.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric", "src/fabric_pipelines", "src/storage", "src/ontology", "src/semantic", "src/agents", "src/operations", "src/intelligence", "src/onboarding", "src/api"]

[tool.hatch.build.targets.wheel.force-include]
"skills/operational-context-graph/SKILL.md" = "skills/operational-context-graph/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999", "E402"]
