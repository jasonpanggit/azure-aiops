[project]
name = "hermes-azure-resource-graph"
version = "0.1.0"
description = "Hermes plugin and connector for Azure Resource Graph to Fabric-aligned ontology datasets"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.19,<2",
  "azure-storage-file-datalake>=12.18,<13",
  "deltalake>=1.0,<2",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.29,<2",
  "pyarrow>=23.0.1,<24",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "ruff>=0.16,<0.17"]

[project.scripts]
hermes-arg = "hermes_arg_connector.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_arg_connector", "src/fabric", "src/storage", "src/ontology", "src/semantic", "src/agents", "src/operations", "src/intelligence"]

[tool.hatch.build.targets.wheel.force-include]
"skills/operational-context-graph/SKILL.md" = "skills/operational-context-graph/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999", "E402"]
