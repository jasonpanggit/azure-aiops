[project]
name = "aiops-azure-resource-graph"
version = "0.1.0"
description = "AIOps plugin and connector for Azure Resource Graph to Fabric-aligned ontology datasets"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.19,<2",
  "azure-keyvault-secrets>=4.9,<5",
  "azure-storage-file-datalake>=12.18,<13",
  "deltalake>=1.0,<2",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.29,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pyarrow>=23.0.1,<24",
  "PyYAML>=6,<7",
  "fsspec>=2024.6,<2025",
  "adlfs>=2024.7,<2025",
]

[project.optional-dependencies]
api = [
    "agent-framework>=1.0,<2",
    "azure-ai-projects>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]
fabric-sql = ["pyodbc==5.3.0"]
eval = ["arize-phoenix==20.4.0", "opentelemetry-sdk==1.44.0"]
test = [
  "pytest>=9.0.3,<10",
  "ruff>=0.16,<0.17",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-sdk>=1.29,<2",
]

[project.scripts]
aiops-inventory = "onboarding.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric", "src/fabric_pipelines", "src/storage", "src/ontology", "src/ontology_discovery", "src/semantic", "src/agents", "src/operations", "src/intelligence", "src/onboarding", "src/api"]

[tool.hatch.build.targets.wheel.force-include]
"skills/operational-context-graph/SKILL.md" = "skills/operational-context-graph/SKILL.md"
# The specialist contract is data, not code, and the loader resolves it next
# to operations/specialist_manifest.py. Force-including it pins that stable
# path in the wheel so an installed distribution cannot lose the manifest to a
# packaging default that only collects .py files.
"src/operations/specialists.v1.json" = "operations/specialists.v1.json"
"src/operations/copilot_canary_authorization.v1.json" = "operations/copilot_canary_authorization.v1.json"
"src/operations/copilot_default_authorization.v1.json" = "operations/copilot_default_authorization.v1.json"
"src/fabric/catalogs/governed_remediation_catalog.v1.json" = "fabric/catalogs/governed_remediation_catalog.v1.json"

[tool.uv]
# Phoenix's evaluation-only pydantic-ai/OpenAI dependency line is not runtime
# compatible with the production agent-framework extra. Keep both lockable,
# but make selecting them together an explicit error instead of silently
# changing the production environment.
conflicts = [
  [
    { extra = "api" },
    { extra = "eval" },
  ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999", "E402"]
