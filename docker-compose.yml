services:
  # Local Postgres for the subscription-connection registry. Same backend
  # used in Azure (Database for PostgreSQL Flexible Server) so local dev and
  # production share the exact same persistence code path.
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "5432:5432"
    volumes:
      - hermes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hermes_postgres_data:
