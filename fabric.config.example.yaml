fabric:
  semantic:
    max_results: 50
    max_traversal_nodes: 500
    max_traversal_depth: 32
    max_source_rows: 50000
    max_entity_rows: 100000
    max_relationship_rows: 250000
    max_serialized_bytes: 1000000
  operations_agent:
    max_output_items: 100
    max_serialized_bytes: 1000000
  patch_intelligence:
    enabled: true
    max_resources: 5000
    max_evidence_rows: 50000
    max_output_items: 100
    max_serialized_bytes: 1000000
  # DataQualityValidator's ownership/tag-coverage rule (MED-06): per-environment
  # missing-ownership/missing-tag thresholds. `mode: warn` counts and reports the
  # gap in QualityReport.rule_counts/failures without flipping `passed=False`;
  # `mode: block` flips `passed=False` once the missing percentage exceeds the
  # configured threshold. Selected by the caller's `environment` (dev/staging/prod)
  # via `DataQualityValidator.from_config(environment)`.
  data_quality:
    ownership_tag_thresholds:
      dev:
        mode: warn
        max_missing_ownership_pct: 100
        max_missing_tag_pct: 100
      staging:
        mode: warn
        max_missing_ownership_pct: 25
        max_missing_tag_pct: 25
      prod:
        mode: block
        max_missing_ownership_pct: 10
        max_missing_tag_pct: 10
  # Dataset-agnostic Fabric medallion health provider (MED-03):
  # `src/fabric/medallion_health.py::dataset_status(table_name)` is the
  # single function every later Phase 10 surface (health API, web tab,
  # Data Agent grounding guardrail) calls for "what is this dataset's
  # status." Freshness objectives are always a bounded multiple of a
  # dataset's own producing-pipeline cadence -- never one global threshold.
  # A table with no explicit entry under `tables:` still gets its own SLO:
  # `default_cadence_minutes * default_slo_multiplier` seconds. Add a
  # `tables.<table_name>` entry (keyed by table name, or a pipeline name
  # your table lookup falls back to) to override `cadence_minutes` and/or
  # `slo_multiplier` for a specific dataset.
  medallion_health:
    freshness_slo:
      default_cadence_minutes: 60
      default_slo_multiplier: 3
      tables:
        silver_incidents:
          cadence_minutes: 15
        silver_alerts:
          cadence_minutes: 15
        silver_cost_actuals:
          cadence_minutes: 1440
        bronze_resource_changes:
          cadence_minutes: 60

  auth:
    mode: managed_identity
    # Set only for a user-assigned managed identity.
    managed_identity_client_id: ""

  # Select by immutable IDs in production. Names are supported for bootstrap.
  workspace_id: "00000000-0000-0000-0000-000000000000"
  workspace_name: ""
  lakehouse_id: "00000000-0000-0000-0000-000000000000"
  lakehouse_name: ""
  # Fabric capacity metadata used for read-only health checks; no secrets.
  capacity:
    subscription_id: "00000000-0000-0000-0000-000000000000"
    resource_group: ""
    capacity_name: ""
  create_lakehouse_if_missing: false
  # Set to dbo (or another schema) for a schema-enabled Lakehouse.
  table_schema: ""
  ontology:
    enabled: true
    ontology_id: "" # Optional immutable ID; otherwise resolved/created by name.
    ontology_name: "Operational_Context_Graph"

  # Fabric-backed topology pipeline.
  topology_pipeline:
    enabled: false
    ontology_id: "" # Optional immutable ID; otherwise resolved/created by name.
    ontology_name: "Topology_Comparison_Ontology"
    # "fixture" (default, no live provisioning) or "live" once NSG Flow
    # Logs / Traffic Analytics is provisioned and approved for this project.
    flow_log_source: "fixture"

  # Fabric-backed operational-context-graph pipeline: full Hermes ontology
  # scope (entity/relationship inference across Application,
  # BusinessService, VirtualMachine, PatchAssessment, AdvisorRecommendation,
  # ... via belongsTo/assessedBy/impacts/dependsOn, ...), not just network
  # topology.
  ontology_pipeline:
    enabled: false

  # Gold pipeline flag inventory (MED-02 staged restoration + rollback map):
  # - topology_pipeline.enabled -> src/fabric_pipelines/topology_pipeline.py
  #   -> topology_entities, topology_edges
  # - ontology_pipeline.enabled -> src/fabric_pipelines/ontology_pipeline.py
  #   -> ontology_entities, ontology_relationships (+ publication metadata)
  # - impact_context_pipeline.enabled -> src/fabric_pipelines/impact_context_builder.py
  #   -> operational_context_graph
  # - vulnerability_pipeline.enabled -> src/fabric_pipelines/vulnerability_pipeline.py
  #   -> assessment_vulnerability_findings
  # - governance_pipeline.enabled -> src/fabric_pipelines/governance_pipeline.py
  #   -> assessment_governance_findings
  # - lifecycle_pipeline.enabled -> src/fabric_pipelines/lifecycle_pipeline.py
  #   -> assessment_lifecycle_findings
  # - patch_pipeline.enabled -> src/fabric_pipelines/patch_pipeline.py
  #   -> assessment_patch_compliance
  # - change_pipeline.enabled -> src/fabric_pipelines/change_pipeline.py
  #   -> assessment_change_findings
  # - predeploy_pipeline.enabled -> src/fabric_pipelines/predeploy_pipeline.py
  #   -> assessment_predeploy_evaluations
  #
  # Note: several of these modules are currently not invoked by the runtime's
  # sync orchestrator yet. They still get dedicated flags now so each module
  # has an explicit rollback switch before staged activation wiring proceeds.
  impact_context_pipeline:
    enabled: false
  vulnerability_pipeline:
    enabled: true
  governance_pipeline:
    enabled: true
  lifecycle_pipeline:
    enabled: true
  patch_pipeline:
    enabled: true
  change_pipeline:
    enabled: true
  predeploy_pipeline:
    enabled: true

  source_data_root: "./live-data"
  # Bounded concurrency keeps independent Delta table writes fast without
  # overwhelming OneLake or creating unbounded client-side pressure.
  write_workers: 4
  registration_attempts: 20
  patch_policies:
    - name: "Production baseline"
      environment: "Production"
      max_patch_age_days: 30
      minimum_compliance_score: 90
    - name: "Development baseline"
      environment: "Development"
      max_patch_age_days: 60
      minimum_compliance_score: 80
  lifecycle:
    enabled: true
    # Empty uses the packaged, vendor-sourced catalog. Set a governed JSON
    # catalog path to update entries without changing code.
    catalog_path: ""
    approaching_months: 24
    near_months: 12
    critical_months: 6
    max_output_items: 100
    max_serialized_bytes: 1000000
  incident_causality:
    enabled: true
    # Correlation is temporal and probabilistic; no action is executed.
    lookback_hours: 168
    max_incidents: 10000
    max_evidence_rows: 50000
  change_intelligence:
    enabled: true
    max_changes: 50000
    max_output_items: 100
  predictive:
    enabled: true
    max_history_rows: 50000
    max_output_items: 100
  remediation:
    enabled: true
    max_resources: 5000
    max_plans: 1000
    max_output_items: 100
    max_dependencies: 100

  # Optional idempotent OneLake shortcuts registered after successful writes.
  shortcuts: []
  # - path: "Files/external"
  #   name: "shared_inventory"
  #   conflict_policy: "CreateOrOverwrite"
  #   target:
  #     oneLake:
  #       workspaceId: "target-workspace-id"
  #       itemId: "target-lakehouse-id"
  #       path: "Tables/bronze_resources"
