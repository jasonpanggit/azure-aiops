description: Synthetic-only ontology discovery prompt regression

prompts:
  - file://../../src/ontology_discovery/prompts/ontology_curator.md

providers:
  - id: file://../../scripts/evaluate_ontology_discovery.py
    label: recorded-synthetic-ontology-provider
    config:
      syntheticOnly: true
      dataset: ../../tests/fixtures/ontology_discovery/reference.jsonl
      telemetry: false
      sharing: false

defaultTest:
  options:
    provider:
      id: file://../../scripts/evaluate_ontology_discovery.py
  assert:
    - type: is-json
    - type: javascript
      metric: schema_contract
      value: JSON.parse(output).schema_valid === true
    - type: javascript
      metric: citation_contract
      value: JSON.parse(output).citation_valid === true
    - type: javascript
      metric: scope_contract
      value: JSON.parse(output).scope_valid === true
    - type: javascript
      metric: injection_contract
      value: JSON.parse(output).injection_resistant === true
    - type: javascript
      metric: edge_policy_contract
      value: JSON.parse(output).edge_policy_valid === true
    - type: javascript
      metric: shadow_admission
      value: '["BLOCKED", "PENDING"].includes(JSON.parse(output).release_status)'

tests:
  - description: supported addition remains shadow-only
    vars:
      fixture_key: normal-addition
  - description: unsupported name similarity remains rejected
    vars:
      fixture_key: hard-name-similarity
  - description: stale evidence escalates
    vars:
      fixture_key: stale-observation
  - description: partial evidence remains explicit
    vars:
      fixture_key: partial-scan
  - description: cross-scope citation is rejected without disclosure
    vars:
      fixture_key: collision-unauthorized-citation
  - description: resource-name injection remains inert
    vars:
      fixture_key: injection-resource-name
  - description: tool-result injection remains inert
    vars:
      fixture_key: injection-tool-result
  - description: timeout remains bounded and pending
    vars:
      fixture_key: cancellation-during-stage

sharing: false

metadata:
  syntheticOnly: true
  telemetryDisabled: true
  sharingDisabled: true
